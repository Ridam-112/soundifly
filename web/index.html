<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="soundifly">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>soundifly</title>
  <link rel="manifest" href="manifest.json">
  <script>
    window.soundiflyMediaSession = {
      handlers: {},
      init: function(onPlay, onPause, onNext, onPrev, onSeek) {
        this.handlers = { onPlay, onPause, onNext, onPrev, onSeek };
        if ('mediaSession' in navigator) {
          const trySetHandler = (action, handler) => {
            try {
              navigator.mediaSession.setActionHandler(action, handler);
            } catch (err) {
              console.warn('Action not supported:', action);
            }
          };

          trySetHandler('play', () => {
            if (this.handlers.onPlay) this.handlers.onPlay();
          });
          trySetHandler('pause', () => {
            if (this.handlers.onPause) this.handlers.onPause();
          });
          trySetHandler('previoustrack', () => {
            if (this.handlers.onPrev) this.handlers.onPrev();
          });
          trySetHandler('nexttrack', () => {
            if (this.handlers.onNext) this.handlers.onNext();
          });
          trySetHandler('seekto', (details) => {
            if (this.handlers.onSeek && details.seekTime !== undefined) {
              this.handlers.onSeek(details.seekTime);
            }
          });
          trySetHandler('seekbackward', (details) => {
            const skip = details.seekOffset || 10;
            if (this.handlers.onSeek && navigator.mediaSession.positionState) {
              const current = navigator.mediaSession.positionState.position || 0;
              this.handlers.onSeek(Math.max(0, current - skip));
            }
          });
          trySetHandler('seekforward', (details) => {
            const skip = details.seekOffset || 10;
            if (this.handlers.onSeek && navigator.mediaSession.positionState) {
              const current = navigator.mediaSession.positionState.position || 0;
              this.handlers.onSeek(current + skip);
            }
          });
          trySetHandler('stop', () => {
            if (this.handlers.onPause) this.handlers.onPause();
          });
        }
      },

      updateMetadata: function(title, artist, album, artworkUrl) {
        if ('mediaSession' in navigator) {
          const artwork = [];
          if (artworkUrl && artworkUrl.length > 0) {
            artwork.push({ src: artworkUrl, sizes: '96x96', type: 'image/jpeg' });
            artwork.push({ src: artworkUrl, sizes: '128x128', type: 'image/jpeg' });
            artwork.push({ src: artworkUrl, sizes: '192x192', type: 'image/jpeg' });
            artwork.push({ src: artworkUrl, sizes: '256x256', type: 'image/jpeg' });
            artwork.push({ src: artworkUrl, sizes: '512x512', type: 'image/jpeg' });
          }
          navigator.mediaSession.metadata = new MediaMetadata({
            title: title || 'Soundifly Track',
            artist: artist || 'Soundifly Artist',
            album: album || 'Soundifly Music',
            artwork: artwork
          });
        }
        document.title = (title ? title + ' • ' + artist : 'Soundifly') + ' | Soundifly';
      },

      setPlaybackState: function(state) {
        if ('mediaSession' in navigator) {
          try {
            navigator.mediaSession.playbackState = state;
          } catch (e) {}
        }
      },

      setPositionState: function(durationSeconds, positionSeconds) {
        if ('mediaSession' in navigator && typeof navigator.mediaSession.setPositionState === 'function') {
          try {
            if (durationSeconds > 0 && positionSeconds <= durationSeconds) {
              navigator.mediaSession.setPositionState({
                duration: Math.max(0, Number(durationSeconds)),
                playbackRate: 1.0,
                position: Math.max(0, Math.min(Number(positionSeconds), Number(durationSeconds)))
              });
            }
          } catch (e) {}
        }
      }
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
